env:
  train:
    env_type: go2_mujoco
    seed: 42
    total_num_envs: 64
    group_size: 1
    max_steps_per_rollout_epoch: 24
    max_episode_steps: 2
    auto_reset: true
    ignore_terminations: false
    use_rel_reward: false
    reward_scale: 1.0
    use_fixed_reset_state_ids: false
    use_ordered_reset_state_ids: false
    is_eval: false
    threads: 8
    randomize: true
    noise: true
    fixed_command: null
    xml_path: null
    video_cfg:
      save_video: false
      video_base_dir: ../rlinf_integration/runs/video/train
    rollout_epoch: 1
  eval:
    env_type: go2_mujoco
    seed: 42
    total_num_envs: 16
    group_size: 1
    max_steps_per_rollout_epoch: 4
    max_episode_steps: 2
    auto_reset: true
    ignore_terminations: false
    use_rel_reward: false
    reward_scale: 1.0
    use_fixed_reset_state_ids: false
    use_ordered_reset_state_ids: false
    is_eval: true
    threads: 4
    randomize: false
    noise: false
    fixed_command:
    - 0.4
    - 0.0
    - 0.0
    xml_path: null
    video_cfg:
      save_video: false
      video_base_dir: ../rlinf_integration/runs/video/eval
    rollout_epoch: 1
  group_name: EnvGroup
actor:
  model:
    model_type: go2_rsl_policy
    model_path: ''
    initial_checkpoint: null
    policy_setup: locomotion
    obs_dim: 45
    critic_obs_dim: 60
    action_dim: 12
    num_action_chunks: 1
    precision: '32'
    add_value_head: true
    is_lora: false
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: '32'
      reduce_dtype: '32'
      buffer_dtype: '32'
    wrappers: {}
    mixed_precision_policies: {}
    mixed_precision_rules: {}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 48
  global_batch_size: 384
  seed: 42
  enable_offload: false
  optim:
    lr: 0.001
    value_lr: 0.001
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,rollout: 8-15
    env: 8
runner:
  task_type: embodied
  logger:
    log_path: outputs/go2_ascend/eight_smoke
    project_name: rlinf
    experiment_name: eight_smoke
    logger_backends:
    - tensorboard
  max_epochs: 3
  max_steps: 3
  only_eval: false
  val_check_interval: 1
  save_interval: 1
  seq_length: 1
  max_prompt_length: 1
  resume_dir: null
  ckpt_path: null
algorithm:
  update_epoch: 5
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_type: go2_rsl_ppo
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.01
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0
  desired_kl: 0.01
rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ''
    precision: '32'
  enable_torch_compile: false
  enable_cuda_graph: false
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.0
    top_k: 0
    top_p: 1.0
    max_new_tokens: 1
reward:
  use_reward_model: false
critic:
  use_critic_model: false
