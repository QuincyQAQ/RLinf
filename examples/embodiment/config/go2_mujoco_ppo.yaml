defaults:
- env/go2_mujoco@env.train
- env/go2_mujoco@env.eval
- model/go2_policy@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0
runner:
  task_type: embodied
  logger:
    log_path: ../rlinf_integration/runs
    project_name: rlinf
    experiment_name: go2_mujoco_smoke
    logger_backends:
    - tensorboard
  max_epochs: 3
  max_steps: 3
  only_eval: false
  val_check_interval: -1
  save_interval: 1
  seq_length: 1
  max_prompt_length: 1
  resume_dir: null
  ckpt_path: null
algorithm:
  update_epoch: 5
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.01
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    is_eval: false
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    rollout_epoch: 1
    total_num_envs: 4
    group_size: ${algorithm.group_size}
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ''
    precision: ${actor.model.precision}
  enable_torch_compile: false
  enable_cuda_graph: false
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.0
    top_k: 0
    top_p: 1.0
    max_new_tokens: 1
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 128
  global_batch_size: 384
  seed: 42
  enable_offload: false
  optim:
    lr: 0.001
    value_lr: 0.001
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0
  fsdp_config:
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
